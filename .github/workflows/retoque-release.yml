name: Retoque draft release

on:
  push:
    tags: ['retoque-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. retoque-v0.3.0 (notes must exist on the selected ref)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: retoque-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  host-checks:
    name: Same-commit source checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      report_run_id: ${{ steps.evidence.outputs.run_id }}
      report_artifact: ${{ steps.evidence.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host prerequisites only
        run: git submodule update --init --depth 1 external/simpleini external/spdlog external/vulkan
      - name: Documentation and registry
        run: |
          python3 tools/check_docs.py
          python3 tests/run_all.py --list
      - name: Complete strict host tier
        run: python3 tests/run_all.py --tier host --jobs 4 --strict --log-dir "$RUNNER_TEMP/release-host"
      - name: Bind report invocation
        id: evidence
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-host/summary.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_id={report['run_id']}\n")
              output.write(f"artifact_name=release-host-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}\n")
          PY
      - name: Retain this invocation's source report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-host/summary.json
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: host-checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the successful source-check report
        uses: actions/download-artifact@v4
        with:
          # Re-running only draft must use the successful producer's original attempt.
          name: ${{ needs.host-checks.outputs.report_artifact }}
          path: ${{ runner.temp }}/release-host
      - name: Validate version, notes and source commit
        id: release
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:REQUESTED_VERSION
          if ($version -cnotmatch '^retoque-v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?$') {
            throw 'Expected retoque-vX.Y.Z, optionally with a prerelease suffix'
          }
          if (-not (Test-Path -LiteralPath "docs/releases/$version.md")) { throw 'Release notes are missing' }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve checkout' }
          $tag = git rev-parse --verify "refs/tags/$version^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0 -and $tag -ne $commit) { throw 'Tag does not point to the selected checkout' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          # A nonexistent tag is allowed for manual drafts; GitHub gets the exact checkout as target.
          exit 0
      - uses: microsoft/setup-msbuild@v3
      - name: Build Release
        id: build
        shell: pwsh
        run: |
          $toolVersion = (& msbuild -nologo -version | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or $toolVersion -notmatch '^[0-9]+(?:\.[0-9]+){1,3}$') {
            throw 'Cannot establish MSBuild version'
          }
          "msbuild_version=$toolVersion" >> $env:GITHUB_OUTPUT
          msbuild OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./tools/package_release.ps1 -SkipBuild -Version $env:RELEASE_VERSION
      - name: Bind archive identity and complete same-commit source evidence
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          HOST_RUN_ID: ${{ needs.host-checks.outputs.report_run_id }}
          MSBUILD_VERSION: ${{ steps.build.outputs.msbuild_version }}
        run: |
          $archive = "release/Retoque-$($env:RELEASE_VERSION.Substring('retoque-'.Length)).zip"
          $report = Join-Path $env:RUNNER_TEMP 'release-host/summary.json'
          python tools/release_manifest.py --archive $archive --version $env:RELEASE_VERSION --host-report $report --require-host --expected-host-run-id $env:HOST_RUN_ID --configuration Release --build-mode workflow-build --msbuild-version $env:MSBUILD_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Release evidence rejected' }
      - name: Create draft and attach archive plus manifest
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const version = process.env.RELEASE_VERSION;
            if (!/^retoque-v\d+\.\d+\.\d+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?$/.test(version)) {
              throw new Error('Invalid release version');
            }
            const name = `Retoque-${version.slice('retoque-'.length)}.zip`;
            const data = fs.readFileSync(`release/${name}`);
            const manifestName = `${name}.manifest.json`;
            const manifestData = fs.readFileSync(`release/${manifestName}`);
            const manifest = JSON.parse(manifestData.toString('utf8'));
            const hash = crypto.createHash('sha256').update(data).digest('hex');
            if (manifest.schema !== 'retoque-release-manifest' || manifest.version !== 1 ||
                manifest.release !== version || manifest.source.commit !== process.env.RELEASE_COMMIT ||
                manifest.source.dirty !== false || manifest.host_tests.status !== 'PASS' ||
                manifest.archive.name !== name || manifest.archive.sha256 !== hash || manifest.archive.size !== data.length) {
              throw new Error('Archive or release identity changed after evidence validation');
            }
            const repo = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {...repo, per_page: 100});
            if (releases.some(r => r.tag_name === version)) {
              throw new Error('Release already exists; refusing to edit a draft or published release');
            }
            const body = fs.readFileSync(`docs/releases/${version}.md`, 'utf8');
            // This workflow has no publish/update/delete operation. Approval and publication are manual.
            const {data: release} = await github.rest.repos.createRelease({
              ...repo, tag_name: version, target_commitish: process.env.RELEASE_COMMIT,
              name: `Retoque ${version}`, body, draft: true, prerelease: true
            });
            if (!release.draft) throw new Error('Expected a draft release');
            for (const [assetName, bytes, contentType] of [
              [name, data, 'application/zip'], [manifestName, manifestData, 'application/json']
            ]) {
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name: assetName, data: bytes,
                headers: {'content-type': contentType, 'content-length': bytes.length}
              });
            }
