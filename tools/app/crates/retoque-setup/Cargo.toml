[package]
name = "retoque-setup"
description = "Windows setup: unpacks the app bundle appended to it and opens the app's install or update review"

version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "retoque_setup"
path = "src/lib.rs"

[[bin]]
name = "retoque-setup"
path = "src/main.rs"

[dependencies]
retoque-data.workspace = true
serde_json = "1.0.154"
sha2 = "0.10"
sys-locale = "0.3.2"
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
