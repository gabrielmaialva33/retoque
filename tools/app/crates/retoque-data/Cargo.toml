[package]
name = "retoque-data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
cap-std = "4"
cap-fs-ext = "4"
retoque-core.workspace = true
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
spirv-cross2 = { version = "=0.7.2", default-features = false, features = ["hlsl"] }
spirv-cross-sys = { version = "=0.7.4", default-features = false }
libloading = "0.8"
regex = "1"
flate2 = "1"
tar = "0.4"

retoque-discovery.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.10"

[dev-dependencies]
divan.workspace = true
proptest.workspace = true

[[bench]]
name = "model_compat_bench"
harness = false
