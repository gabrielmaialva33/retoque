<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Retoque: DLSS 5 Neural Rendering for any game">
  <!-- The app's own look: its icon (tools/app/crates/retoque-app/assets/retoque.svg, drawn here at 176 px; keep the
       two in step) and its theme colours (tools/app/crates/retoque-app/src/theme.rs: BG, CARD, CARD_EDGE, ACCENT,
       TEXT, MUTED). An SVG shown through <img> cannot load another file, so the icon's shapes are repeated. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121418"/>
      <stop offset="1" stop-color="#1C2026"/>
    </linearGradient>
    <linearGradient id="icon-stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E07F2C"/>
      <stop offset="1" stop-color="#F8C66C"/>
    </linearGradient>
    <linearGradient id="icon-after" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2129"/>
      <stop offset="1" stop-color="#2B3240"/>
    </linearGradient>
    <clipPath id="icon-frame"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1278" height="318" rx="23" fill="url(#bg)" stroke="#2A2F37" stroke-width="2"/>

  <!-- Coarse pixels, as in the icon, fading out toward the text; one of them already retouched. -->
  <g>
    <rect x="1000" y="44" width="40" height="40" rx="5" fill="#2B323D" opacity="0.24"/><rect x="1048" y="44" width="40" height="40" rx="5" fill="#404959" opacity="0.38"/><rect x="1096" y="44" width="40" height="40" rx="5" fill="#2B323D" opacity="0.55"/><rect x="1144" y="44" width="40" height="40" rx="5" fill="#353D4A" opacity="0.74"/><rect x="1192" y="44" width="40" height="40" rx="5" fill="#404959" opacity="0.92"/>
    <rect x="952" y="92" width="40" height="40" rx="5" fill="#2B323D" opacity="0.14"/><rect x="1048" y="92" width="40" height="40" rx="5" fill="#353D4A" opacity="0.38"/><rect x="1096" y="92" width="40" height="40" rx="5" fill="#2B323D" opacity="0.55"/><rect x="1144" y="92" width="40" height="40" rx="5" fill="#2B323D" opacity="0.74"/><rect x="1192" y="92" width="40" height="40" rx="5" fill="#2B323D" opacity="0.92"/>
    <rect x="904" y="140" width="40" height="40" rx="5" fill="#2B323D" opacity="0.07"/><rect x="952" y="140" width="40" height="40" rx="5" fill="#2B323D" opacity="0.14"/><rect x="1000" y="140" width="40" height="40" rx="5" fill="#404959" opacity="0.24"/><rect x="1048" y="140" width="40" height="40" rx="5" fill="#404959" opacity="0.38"/><rect x="1144" y="140" width="40" height="40" rx="5" fill="#404959" opacity="0.74"/><rect x="1192" y="140" width="40" height="40" rx="5" fill="#2B323D" opacity="0.92"/>
    <rect x="904" y="188" width="40" height="40" rx="5" fill="#353D4A" opacity="0.07"/><rect x="1048" y="188" width="40" height="40" rx="5" fill="#404959" opacity="0.38"/><rect x="1096" y="188" width="40" height="40" rx="5" fill="#2B323D" opacity="0.55"/><rect x="1144" y="188" width="40" height="40" rx="5" fill="#353D4A" opacity="0.74"/><rect x="1192" y="188" width="40" height="40" rx="5" fill="#353D4A" opacity="0.92"/>
    <rect x="1048" y="236" width="40" height="40" rx="5" fill="#404959" opacity="0.38"/><rect x="1096" y="236" width="40" height="40" rx="5" fill="#2B323D" opacity="0.55"/><rect x="1144" y="236" width="40" height="40" rx="5" fill="#2B323D" opacity="0.74"/><rect x="1192" y="236" width="40" height="40" rx="5" fill="#404959" opacity="0.92"/>
    <path d="M1116 132 l7 21 21 7 -21 7 -7 21 -7 -21 -21 -7 21 -7 z" fill="#F8C66C"/>
  </g>

  <!-- The icon: a retouch stroke across coarse pixels. -->
  <g transform="translate(72 72) scale(0.6875)">
    <g clip-path="url(#icon-frame)">
      <rect width="256" height="256" fill="#14171C"/>
      <path d="M256 0 L256 256 L0 256 Z" fill="url(#icon-after)"/>
      <rect x="24" y="24" width="38" height="38" rx="5" fill="#2B323D"/><rect x="68" y="24" width="38" height="38" rx="5" fill="#353D4A"/><rect x="112" y="24" width="38" height="38" rx="5" fill="#404959"/><rect x="24" y="68" width="38" height="38" rx="5" fill="#404959"/><rect x="68" y="68" width="38" height="38" rx="5" fill="#2B323D"/><rect x="24" y="112" width="38" height="38" rx="5" fill="#353D4A"/>
      <path d="M30 226 C 92 178, 150 116, 226 30" fill="none" stroke="url(#icon-stroke)" stroke-width="34" stroke-linecap="round"/>
      <path d="M190 150 l7 21 21 7 -21 7 -7 21 -7 -21 -21 -7 21 -7 z" fill="#F8C66C"/>
    </g>
    <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#2A2F37" stroke-width="3"/>
  </g>

  <text x="290" y="166" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#F0A845" letter-spacing="-1">Retoque</text>
  <text x="294" y="214" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#D6DBE2">DLSS 5 Neural Rendering for any game</text>
  <text x="294" y="252" font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#8E97A4">Linux and Windows · built on OptiScaler</text>
</svg>
