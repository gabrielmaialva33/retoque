; OptiScaler.ini for RetoqueWindowHost's own folder (NR on any window, docs/dlssnr/design/nr-anything.md).
; Copy it beside RetoqueWindowHost.exe, OptiScaler.dll and nvngx.dll_dlssnr.dll as OptiScaler.ini. It configures the
; DLL inside the host process only; never put it, or that folder's DLLs, in a game folder.
; Keys left out are auto. Every key below is a shipped OptiScaler.ini key with the same meaning.

[DlssNr]
Enabled=true
; The present pass: it runs on the host's own swapchain backbuffer, the captured frame.
HookMethod=2
; No game hands over depth or motion here: run on constant depth and zero motion, or SynthMotion's estimate.
RequireDlss=false
; false shows the capture unchanged while the pass still runs (the A/B for the first run).
ApplyModel=true
; auto: nvngx_dlssnr.dll beside OptiScaler.dll. Or a full path to the user's model file.
ModelFile=auto
SynthMotion=auto
UiProtection=auto
ZeroGuideReset=auto
WorkingScale=auto

[Menu]
; The host has no in-game menu; this also keeps the DLL from hooking d3d12.dll in the host.
OverlayMenu=false

[FrameGen]
FGInput=nofg
FGOutput=nofg

[Vulkan]
SkipHooks=true

[Hotfix]
CheckForUpdate=false

[Log]
LogToFile=true
LogLevel=2
